<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox and Grid Assignment</title>
  <link rel="stylesheet" href="task33.css">
</head>
<body>

  <h1>MERN Full Stack Internship Program</h1>

  <h2>Task 1: Responsive 3-Section Layout Using Flexbox</h2>

  <div class="flex-container">
    <div class="box box1">
      <h3>Section 1</h3>
      <p>This is the first Flexbox section.</p>
    </div>

    <div class="box box2">
      <h3>Section 2</h3>
      <p>This is the second Flexbox section.</p>
    </div>

    <div class="box box3">
      <h3>Section 3</h3>
      <p>This is the third Flexbox section.</p>
    </div>
  </div>

  <h2>Task 2: Simple Photo Gallery Using Grid</h2>

  <div class="gallery">
    <img src="sp1.jpg" alt="Gallery Image 1">
    <img src="sp2.jpg" alt="Gallery Image 2">
    <img src="sp3.jpg" alt="Gallery Image 3">
    <img src="sp4.jpg" alt="Gallery Image 4">
  </div>

</body>
