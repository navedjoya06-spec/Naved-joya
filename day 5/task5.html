<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Interactive Buttons, Form & Calculator</title>
	<style>
		:root { font-family: Arial, sans-serif; }
		body { margin: 0; padding: 24px; background: #f5f5f5; color: #222; transition: .2s; }
		body.dark { background: #1d1d1d; color: #f5f5f5; }
		section { max-width: 650px; margin: 0 auto 22px; padding: 20px; border-radius: 10px; background: rgba(255,255,255,.9); box-shadow: 0 2px 8px #0002; }
		.dark section { background: #303030; }
		button, select, input { margin: 5px 3px; padding: 8px 12px; font-size: 1rem; }
		button { cursor: pointer; border: 1px solid #999; border-radius: 5px; }
		.message { min-height: 22px; color: #c62828; font-weight: bold; }
		#textDemo { font-size: 20px; }
	</style>
</head>
<body>
	<h1>Interactive Web Page</h1>

	<section>
		<h2>Task 1: Interactive Buttons</h2>
		<p id="textDemo">Change my color, font, size and style.</p>
		<button onclick="setColor('red')">RED</button>
		<button onclick="setColor('green')">GREEN</button>
		<button onclick="setColor('blue')">BLUE</button>
		<select id="fontSelect" onchange="changeFont(this.value)">
			<option value="Arial">Arial</option>
			<option value="Georgia">Georgia</option>
			<option value="Courier New">Courier New</option>
			<option value="Verdana">Verdana</option>
		</select>
		<button onclick="changeSize(1)">A+</button>
		<button onclick="changeSize(-1)">A-</button>
		<button onmouseover="setStyle('bold')">Bold</button>
		<button onmouseover="setStyle('italic')">Italic</button>
		<button onmouseover="setStyle('underline')">Underline</button>
	</section>

	<section>
		<h2>Task 2: Simple Form Validation</h2>
		<form id="userForm" novalidate>
			<input id="name" type="text" placeholder="Name">
			<input id="email" type="email" placeholder="Email">
			<button type="submit">Submit</button>
		</form>
		<p id="formMessage" class="message"></p>
	</section>

	<section>
		<h2>Task 3: Simple Calculator</h2>
		<input id="firstNumber" type="number" placeholder="First number">
		<input id="secondNumber" type="number" placeholder="Second number">
		<div>
			<button onclick="calculate('+')">Add</button>
			<button onclick="calculate('-')">Subtract</button>
			<button onclick="calculate('*')">Multiply</button>
			<button onclick="calculate('/')">Divide</button>
		</div>
		<p id="calculatorMessage" class="message"></p>
		<strong id="result"></strong>
	</section>

	<section>
		<h2>Bonus: Theme Switcher</h2>
		<button onclick="setTheme('light')">Light</button>
		<button onclick="setTheme('dark')">Dark</button>
	</section>

	<script>
		const demo = document.getElementById('textDemo');
		function setColor(color) { demo.style.color = color; }
		function changeFont(font) { demo.style.fontFamily = font; }
		function changeSize(amount) {
			const size = parseFloat(getComputedStyle(demo).fontSize) + amount;
			demo.style.fontSize = Math.max(10, size) + 'px';
		}
		function setStyle(style) {
			demo.style.fontWeight = style === 'bold' ? 'bold' : 'normal';
			demo.style.fontStyle = style === 'italic' ? 'italic' : 'normal';
			demo.style.textDecoration = style === 'underline' ? 'underline' : 'none';
		}

		document.getElementById('userForm').addEventListener('submit', function (event) {
			event.preventDefault();
			const message = document.getElementById('formMessage');
			if (!document.getElementById('name').value.trim() || !document.getElementById('email').value.trim()) {
				message.textContent = 'Please fill in all form fields.';
				return;
			}
			message.style.color = 'green';
			message.textContent = 'Form submitted successfully.';
		});

		function calculate(operator) {
			const first = document.getElementById('firstNumber').value;
			const second = document.getElementById('secondNumber').value;
			const message = document.getElementById('calculatorMessage');
			const result = document.getElementById('result');
			message.textContent = '';
			if (first === '' || second === '') {
				message.textContent = 'Please enter both numbers.';
				result.textContent = '';
				return;
			}
			const a = Number(first), b = Number(second);
			if (operator === '/' && b === 0) {
				message.textContent = 'Cannot divide by zero.';
				result.textContent = '';
				return;
			}
			const value = operator === '+' ? a + b : operator === '-' ? a - b : operator === '*' ? a * b : a / b;
			result.textContent = 'Result: ' + value;
		}
		function setTheme(theme) { document.body.classList.toggle('dark', theme === 'dark'); }
	</script>
</body>
</html>
