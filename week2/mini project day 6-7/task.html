<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather App</title>
  <link rel="stylesheet" href="task.css">
</head>
<body>

  <div class="weather-card">
    <h1>Weather App</h1>
    
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
      <button id="search-btn">Search</button>
    </div>

    <div id="weather-result">
      <!-- Data, loading spinner, or error messages will appear here -->
      <p class="placeholder-text">Enter a city to get started.</p>
    </div>
  </div>

  <script src="task.js"></script>
</body>
</html>
